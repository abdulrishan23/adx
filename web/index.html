<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ink tile on light browser chrome, paper tile on dark. It follows the browser or OS theme, not the in-app switch. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Sets the theme before the page paints, so dark mode never flashes
      // light. Keep the key and logic in step with src/lib/theme.ts.
      (() => {
        try {
          const pref = localStorage.getItem("adx-theme");
          const dark =
            pref === "dark" ||
            (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch {
          // Storage can be blocked; the app then follows the system theme.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
